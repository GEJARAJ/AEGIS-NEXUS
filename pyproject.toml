[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-nexus"
version = "0.1.0"
description = "AEGIS NEXUS — Civic Sentinel (NEXA ENGINE): AI-Powered Public Infrastructure Intelligence and Citizen Impact Early Warning System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GEJARAJ" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-v"
